<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookly Support</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 680px;
      height: 100dvh;
      max-height: 780px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    header {
      padding: 20px 24px;
      background: #1a1a2e;
      color: #fff;
    }

    header h1 { font-size: 1.25rem; font-weight: 600; }
    header p  { font-size: 0.85rem; color: #a0a0b8; margin-top: 2px; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.93rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #1a1a2e;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #f0f0f5;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .message.typing { color: #888; font-style: italic; }

    form {
      display: flex;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid #eee;
      background: #fff;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 0.93rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #1a1a2e; }

    button {
      padding: 10px 18px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.93rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:hover:not(:disabled) { opacity: 0.85; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>📚 Bookly Support</h1>
      <p>How can we help you today?</p>
    </header>
    <div id="messages"></div>
    <form id="chat-form">
      <input id="input" type="text" placeholder="Type your message…" autocomplete="off" />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>
  <script src="chat.js"></script>
</body>
</html>
